name: Depot tracken

on:
  schedule:
    - cron: "*/5 6-20 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - portfolio.json

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tracker.py
      - name: Daten committen
        run: |
          git config user.name "depot-bot"
          git config user.email "depot-bot@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || (git commit -m "Update $(date -u +%FT%TZ)" && git pull --rebase && git push)
