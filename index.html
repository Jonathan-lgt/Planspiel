<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depot-Verlauf</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #14181f; --muted: #667085;
    --line: #e4e7ec; --accent: #2563eb; --up: #15803d; --down: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #161b22; --text: #e8ecf1; --muted: #8b95a5;
      --line: #262d38; --accent: #60a5fa; --up: #4ade80; --down: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  #chart { width: 100%; height: 60vh; min-height: 360px; }
  .msg { padding: 32px 16px; text-align: center; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; margin: 12px 4px; }
</style>
</head>
<body>
<main>
  <h1>Depot-Verlauf</h1>

  <section class="stats" id="stats" hidden>
    <div class="stat"><div class="label">Depotwert</div><div class="value" id="s-now">–</div><div class="sub" id="s-time">–</div></div>
    <div class="stat"><div class="label">Seit Start</div><div class="value" id="s-start">–</div><div class="sub" id="s-start-abs">–</div></div>
    <div class="stat"><div class="label">Heute</div><div class="value" id="s-day">–</div><div class="sub" id="s-day-abs">–</div></div>
    <div class="stat"><div class="label">Hoch / Tief (sichtbar)</div><div class="value" id="s-hi">–</div><div class="sub" id="s-lo">–</div></div>
  </section>

  <div class="card"><div id="chart"></div></div>
  <div class="msg" id="msg" hidden></div>
  <footer id="foot">Kurse via Yahoo Finance (ggf. 15 min verzögert). Eigener Nachbau, nicht die offiziellen Werte von Planspiel Börse.</footer>
</main>

<script src="https://cdn.plot.ly/plotly-basic-2.35.2.min.js" charset="utf-8"></script>
<script>
const EUR = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
const PCT = new Intl.NumberFormat("de-DE", { style: "percent", minimumFractionDigits: 2, signDisplay: "always" });
const SGN = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", signDisplay: "always" });
const $ = id => document.getElementById(id);

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function setDelta(valEl, absEl, now, base) {
  if (!base) { valEl.textContent = "–"; absEl.textContent = ""; return; }
  const d = now - base, p = d / base;
  valEl.textContent = PCT.format(p);
  valEl.className = "value " + (d >= 0 ? "up" : "down");
  absEl.textContent = SGN.format(d);
}

async function load() {
  const bust = "?t=" + Date.now();
  const [hist, pf] = await Promise.all([
    fetch("data/history.json" + bust).then(r => r.json()),
    fetch("portfolio.json" + bust).then(r => r.json()).catch(() => ({}))
  ]);
  return { hist, start: pf.start_value };
}

function render({ hist, start }) {
  if (!hist.length) {
    $("msg").hidden = false;
    $("msg").textContent = "Noch keine Daten. Der erste Lauf erscheint hier, sobald der Workflow einmal gelaufen ist.";
    $("chart").style.display = "none";
    return;
  }
  $("msg").hidden = true; $("chart").style.display = ""; $("stats").hidden = false;

  const x = hist.map(p => new Date(p.t));
  const y = hist.map(p => p.v);
  const last = hist[hist.length - 1];

  $("s-now").textContent = EUR.format(last.v);
  $("s-time").textContent = new Date(last.t).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });
  setDelta($("s-start"), $("s-start-abs"), last.v, start);

  // "Heute" = Veränderung seit dem letzten Wert vor Beginn des heutigen Tages (lokal)
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const before = [...hist].reverse().find(p => new Date(p.t) < midnight);
  setDelta($("s-day"), $("s-day-abs"), last.v, before ? before.v : (hist[0].v));

  const line = css("--accent"), text = css("--text"), muted = css("--muted"), grid = css("--line");
  const trace = {
    x, y, type: "scatter", mode: "lines",
    line: { color: line, width: 2, shape: "hv" },
    fill: "tozeroy", fillcolor: line + "14",
    hovertemplate: "%{x|%d.%m. %H:%M}<br><b>%{y:,.2f} €</b><extra></extra>"
  };
  const shapes = start ? [{ type: "line", xref: "paper", x0: 0, x1: 1, y0: start, y1: start,
    line: { color: muted, width: 1, dash: "dot" } }] : [];

  const layout = {
    margin: { l: 64, r: 16, t: 8, b: 40 },
    paper_bgcolor: "transparent", plot_bgcolor: "transparent",
    font: { color: text, family: "system-ui, sans-serif" },
    hovermode: "x unified", dragmode: "pan", shapes, uirevision: "keep",
    xaxis: {
      type: "date", gridcolor: grid, linecolor: grid,
      rangeselector: {
        bgcolor: "transparent", activecolor: grid, font: { color: text },
        buttons: [
          { count: 1, label: "1 Std", step: "hour", stepmode: "backward" },
          { count: 1, label: "1 Tag", step: "day", stepmode: "backward" },
          { count: 7, label: "1 Wo", step: "day", stepmode: "backward" },
          { count: 1, label: "1 Mon", step: "month", stepmode: "backward" },
          { step: "all", label: "Alles" }
        ]
      },
      // Wochenenden und Nächte ausblenden, damit der Verlauf nicht flach "gestreckt" wirkt
      rangebreaks: [{ pattern: "day of week", bounds: ["sat", "mon"] }]
    },
    yaxis: { tickformat: ",.0f", ticksuffix: " €", gridcolor: grid, zeroline: false, fixedrange: false }
  };

  Plotly.react("chart", [trace], layout, { responsive: true, displaylogo: false, scrollZoom: true,
    modeBarButtonsToRemove: ["select2d", "lasso2d", "autoScale2d"] });

  const gd = $("chart");
  gd.removeAllListeners && gd.removeAllListeners("plotly_relayout");
  gd.on("plotly_relayout", updateHiLo);
  function updateHiLo() {
    const r = gd.layout.xaxis.range;
    let ys = y;
    if (r) {
      const a = new Date(r[0]), b = new Date(r[1]);
      ys = y.filter((_, i) => x[i] >= a && x[i] <= b);
    }
    if (!ys.length) return;
    $("s-hi").textContent = EUR.format(Math.max(...ys));
    $("s-lo").textContent = "Tief: " + EUR.format(Math.min(...ys));
  }
  updateHiLo();
}

async function refresh() {
  try { render(await load()); }
  catch (e) {
    $("msg").hidden = false;
    $("msg").textContent = "Daten konnten nicht geladen werden: " + e.message;
  }
}
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
